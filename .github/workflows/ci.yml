# CI for pull requests. GitHub only schedules the jobs; they RUN on self-hosted runners in the local kind cluster:
#   ci  -> scale set "arc-runner-set" (dummy/k8s/arc-runner-values.yaml)
#   e2e -> scale set "arc-runner-e2e" (dummy/k8s/arc-runner-e2e-values.yaml)
#
# Security:
# - "pull_request" (never "pull_request_target"): fork PRs get no secrets and a read-only token.
# - Repo setting "Require approval for all external contributors" is the real guard against
#   strangers: a fork PR can edit this file, so the `if:` below only stops accidental runs.
# - Actions are pinned to full commit SHAs; the token can only read; checkout keeps no credentials.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-runner-set
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm (version from package.json)
        run: corepack enable && pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Local CI (install, lint, typecheck, build)
        run: pnpm ci:local

  # End-to-end tests (spec: docs/specs/e2e-product-crud.spec.md) on the E2E runner scale set:
  # one pod with Chromium + Postgres + Redis sidecars on localhost (dummy/k8s/arc-runner-e2e-values.yaml).
  e2e:
    name: e2e
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-runner-e2e
    timeout-minutes: 20
    env:
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: e2e-throwaway      # only valid inside the runner pod's own sidecar
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: E2E tests (Playwright)
        run: pnpm e2e

      - name: Job summary
        if: always()
        run: node ci/e2e-summary.mjs frontend/test-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
