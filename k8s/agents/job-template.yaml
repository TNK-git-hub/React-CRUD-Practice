# Template for ONE agent Job. Not used directly: dispatch.sh replaces __JOB_ID__, __BASE_BRANCH__, __MODE__, __DEADLINE__
# (checked to hold only safe characters); the task and the PR title are in the ConfigMap "task-__JOB_ID__".
#
# Needed in the namespace beforehand (see README.md):
#   Secret    agent-secrets  (CLAUDE_CODE_OAUTH_TOKEN; GH_READ_TOKEN only for a private repo; no GitHub write token:
#                             the host pushes and opens the PR with collect.sh)
#   ConfigMap mwg-ca         (CA of the company proxy)
#   ConfigMap agent-script   (run.sh; dispatch.sh creates / updates it from k8s/agents/run.sh)
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-__JOB_ID__
  labels:
    app: claude-agent-job
    agent-job-id: __JOB_ID__
spec:
  ttlSecondsAfterFinished: 600   # keep the pod 10 minutes after it ends, so the log can still be read
  backoffLimit: 0
  activeDeadlineSeconds: __DEADLINE__   # full: 5400 (plan → red → green → review), code-only: 2400
  template:
    metadata:
      labels:
        app: claude-agent-job
        agent-job-id: __JOB_ID__
    spec:
      restartPolicy: Never
      volumes:
        - name: script
          configMap:
            name: agent-script
        - name: task
          configMap:
            name: task-__JOB_ID__
        - name: mwg-ca
          configMap:
            name: mwg-ca
      containers:
        - name: agent
          image: node:22-bookworm
          command: ["bash", "/scripts/run.sh"]
          volumeMounts:
            - { name: script, mountPath: /scripts }
            - { name: task, mountPath: /task }
            - { name: mwg-ca, mountPath: /usr/local/share/ca-certificates/mwg }
          envFrom:
            - secretRef:
                name: agent-secrets
          env:
            - { name: REPO, value: TNK-git-hub/React-CRUD-Practice }
            - { name: BASE_BRANCH, value: __BASE_BRANCH__ }
            - { name: JOB_ID, value: __JOB_ID__ }
            - { name: MODE, value: __MODE__ }               # full | code-only
            - { name: MAX_FIX_ATTEMPTS, value: "2" }        # rounds of code-writer fixes when ci:local fails
            - { name: REVIEW_ROUNDS, value: "2" }           # rounds back to the writers after review
            - { name: MUTATION_MIN, value: "70" }           # minimum mutation score (%) on the changed src files
            - { name: NODE_EXTRA_CA_CERTS, value: /usr/local/share/ca-certificates/mwg/mwg-ca.crt }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 3Gi }
