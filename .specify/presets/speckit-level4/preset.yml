schema_version: "1.0"

preset:
  id: "speckit-level4"
  name: "Spec Kit Level 4 (delta specs)"
  version: "0.3.0"
  description: "speckit.specify writes delta specs into specs/changes/NNN-<name>/ against living capability specs"
  author: "AI-native-practice"
  repository: "https://github.com/TNK-git-hub/React-CRUD-Practice"
  license: "MIT"

requires:
  speckit_version: ">=1.3.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Level 4 specify - delta spec in specs/changes/NNN-<name>/ with ADDED/MODIFIED/REMOVED by ID"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Level 4 clarify - answers go into the rich delta spec; edge cases become (unassigned) rows; never touches Architecture Decisions / Data Model"
      replaces: "speckit.clarify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Level 4 plan - plan.md with Test Strategy and Quickstart; ADRs and Data Model go into spec.md; no research/data-model/contracts/quickstart files"
      replaces: "speckit.plan"

tags:
  - "level4"
  - "delta-spec"
  - "capabilities"
